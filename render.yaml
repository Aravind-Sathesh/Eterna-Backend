services:
  # 1. The managed Redis instance
  - name: eterna-redis
    type: redis
    plan: free
    ipAllowList: []

  # 2. The API Gateway (a public web service)
  - name: eterna-api-gateway
    type: web
    plan: free
    env: docker
    build:
      context: .
      dockerfilePath: ./Dockerfile
      target: api-gateway
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString

  # 3. The WebSocket Server (another public web service)
  - name: eterna-websocket-server
    type: web
    plan: free
    env: docker
    build:
      context: .
      dockerfilePath: ./Dockerfile
      target: websocket-server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString

  # 4. The Aggregator Producer (a background worker)
  - name: eterna-aggregator-producer
    type: worker
    plan: free
    env: docker
    build:
      context: .
      dockerfilePath: ./Dockerfile
      target: aggregator-producer
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString

  # 5. The Aggregator Worker (another background worker)
  - name: eterna-aggregator-worker
    type: worker
    plan: free
    env: docker
    build:
      context: .
      dockerfilePath: ./Dockerfile
      target: aggregator-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString
