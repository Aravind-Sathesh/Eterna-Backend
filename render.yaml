services:
  # 1. The managed Redis instance
  - name: eterna-redis
    type: redis
    plan: free
    ipAllowList: []

  # 2. The API Gateway
  - name: eterna-api-gateway
    type: web
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerBuildTarget: api-gateway
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString

  # 3. The WebSocket Server
  - name: eterna-websocket-server
    type: web
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerBuildTarget: websocket-server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString

  # 4. The Aggregator Producer
  - name: eterna-aggregator-producer
    type: worker
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerBuildTarget: aggregator-producer
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString

  # 5. The Aggregator Worker
  - name: eterna-aggregator-worker
    type: worker
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerBuildTarget: aggregator-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: eterna-redis
          property: connectionString
